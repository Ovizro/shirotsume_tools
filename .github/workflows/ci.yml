name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Install project deps so pyright can resolve imports.
      # ruff and pyright themselves are NOT project deps —
      # they run as independent tools via uvx (see below).
      - name: Install project dependencies
        run: uv sync --all-extras --python 3.12
        env:
          USE_CYTHON: "1"

      # ruff and pyright are invoked via uvx (ephemeral isolated env),
      # not via `uv run` — they are global tools, not project dependencies.
      - name: Ruff
        run: uvx ruff check .

      - name: Pyright
        run: uvx pyright

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}
        env:
          USE_CYTHON: "1"

      - name: Run tests
        run: uv run pytest tests/ -v
