[build-system]
requires = ["setuptools>=61.0", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shirotsume_tools"
dynamic = ["version"]
description = "tools for shirotsume"
license = "GPL-3.0-or-later"
authors = [
    {name = "Moe"},
]
maintainers = [
    {name = "Ovizro", email = "Ovizro@visecy.org"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Cython",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "typing_extensions",
    "antlr4-python3-runtime>=4.13",
    "KoiLang>=2.0.0b1",
    "pydantic>=2.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
export = ["pandas", "openpyxl"]
translation = ["openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/elementary-particle/shirotsume_tools"

[tool.setuptools]
package-data = {"*" = ["*.pyi", "*.pyx", "*.pxd", "*.h", "*.g4"]}

[tool.setuptools.dynamic]
version = {attr = "shirotsume_tools._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["shirotsume_tools*"]
exclude = ["build*", "tests*"]

[tool.ruff]
line-length = 127
target-version = "py310"
exclude = [
    "shirotsume_tools/parser/Shirotsume*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E402", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["shirotsume_tools"]

[tool.ruff.format]
line-ending = "lf"

# pyright is a global tool (uv tool install pyright), not a project dep.
# venvPath/venv point it at the project venv so it can resolve imports.
[tool.pyright]
include = ["shirotsume_tools", "tests"]
exclude = [
    "shirotsume_tools/parser/Shirotsume*.py",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportPossiblyUnboundVariable = "warning"

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "cython>=3.2.6",
    "pytest>=9.1.1",
    "shirotsume-tools[export,translation]",
]
